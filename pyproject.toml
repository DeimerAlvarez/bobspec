[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bobspec"
dynamic = ["version"]
description = "Interactive and batch tools for 1-D stellar spectra: co-addition, normalisation, radial velocities, broadening."
license = "MIT"
keywords = ["astronomy", "spectroscopy", "radial velocity", "continuum normalisation", "stellar spectra"]
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Deimer Antonio Alvarez Garay", email = "deimer.alvarez@inaf.it" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "astropy>=5.3",
    "matplotlib>=3.8",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Intended Audience :: Science/Research",
]

[project.urls]
Homepage = "https://github.com/DeimerAlvarez/bobspec"
Documentation = "https://github.com/DeimerAlvarez/bobspec/blob/main/GETTING_STARTED.md"
Issues = "https://github.com/DeimerAlvarez/bobspec/issues"
Changelog = "https://github.com/DeimerAlvarez/bobspec/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7.4", "pytest-cov"]
dev = ["bobspec[test]", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
bob = "bobspec.cli:main"

[tool.setuptools.dynamic]
version = { attr = "bobspec.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::astropy.utils.exceptions.AstropyWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE", "D", "NPY", "PTH", "RUF"]
ignore = ["D105", "D107", "PTH123"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
